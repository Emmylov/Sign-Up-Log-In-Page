<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Sign Up / Log In</title>
  <link href="styles/login.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>
<body>
  <div class="container">
    <div class="card-split">
      <div class="left-panel">
        <div class="left-inner">
          <h2>Welcome Back!</h2>
          <p class="left-sub">To keep connected with us please login with your personal info</p>

          <a class="outline-btn" href="index.html">SIGN IN</a>
        </div>
      </div>

      <div class="right-panel">
        <div class="right-inner">
          <h1>Create Account</h1>
          <div class="social-row">
            <button class="social"><i class="ph-facebook-logo"></i></button>
            <button class="social"><i class="ph-google-logo"></i></button>
            <button class="social"><i class="ph-linkedin-logo"></i></button>
          </div>
          <p class="lead small">or use your email for registration</p>

          <form id="signupForm" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" class="input" type="text" placeholder="Name" />
              <small id="nameError"></small>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" class="input" type="email" placeholder="Email" />
              <small id="emailError"></small>
            </div>

            <div class="field password-box">
              <label for="password">Password</label>
              <input id="password" class="input" type="password" placeholder="Password" />
              <i id="togglePassword" class="ph ph-eye"></i>
              <small id="passwordError"></small>
            </div>

            <div class="strength-meter">
              <div class="strength-bar"><span id="strengthBar"></span></div>
              <div class="strength-text" id="strengthText" aria-live="polite"></div>
            </div>

            <button class="primary" type="submit">SIGN UP</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italianno&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="container">
        <form id="loginForm">
            <h1>Welcome Back</h1>
            <p>Login to continue using your account.</p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
            <small id="emailError"></small>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Enter your password">
                <i class="ph ph-eye" id="togglePassword"></i>
            </div>
            <small id="passwordError"></small>

            <div class="options">
                <label>
                    <input type="checkbox">Remember me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </form>
    </div>

    <script src="scripts/login.js"></script>
    
</body>
</html>

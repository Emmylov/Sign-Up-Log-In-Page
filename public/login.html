<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="container">
        <div class="card-login">
            <form id="loginForm" class="card" novalidate>
                <h1>Welcome Back</h1>
                <p class="lead small">Login to continue using your account.</p>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>

                <div class="field password-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" placeholder="Enter your password">
                    <i class="ph ph-eye" id="togglePassword" aria-hidden="true"></i>
                    <small id="passwordError"></small>
                </div>

                <div class="options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <button class="primary" type="submit">Login</button>

                <p class="signup">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>

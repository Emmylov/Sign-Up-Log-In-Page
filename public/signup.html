<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italianno&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,[...]
    " rel="stylesheet">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="styles/signup.css">
</head>
<body>
    <div class="container">
        <form id="signupForm">
            <h1>Create Account</h1>
            <p>Sign up to get started.</p>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <small id="nameError"></small>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
            <small id="emailError"></small>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Create a password">
                <i class="ph ph-eye" id="togglePassword"></i>
            </div>
            <small id="passwordError"></small>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-box">
                <input type="password" id="confirmPassword" placeholder="Repeat your password">
                <i class="ph ph-eye" id="toggleConfirmPassword"></i>
            </div>
            <small id="confirmPasswordError"></small>

            <div class="options">
                <label>
                    <input type="checkbox" id="terms"> I agree to the Terms
                </label>
            </div>

            <button class="primary" type="submit">Sign Up</button>
            <p class="signup">
                Already have an account?
                <a href="index.html">Login</a>
            </p>
        </form>
    </div>

    <script src="scripts/signup.js"></script>
</body>
</html>
